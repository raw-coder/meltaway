<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meltaway · Trailer</title>
<meta name="description" content="A visual timer you can see melt. Four calm looks, gentle or hidden numbers, made for time blindness and ADHD.">
<meta property="og:title" content="Meltaway · Trailer">
<meta property="og:description" content="A visual timer you can see melt. Four calm looks, gentle or hidden numbers, made for time blindness and ADHD.">
<meta property="og:image" content="poster.jpg">
<style>
  :root { --bg: #f3efe8; --card: #fffaf2; --ink: #1d1a17; --muted: #6b635a; --accent: #c9822e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141210; --card: #201c19; --ink: #f6efe4; --muted: #ada39a; --accent: #e7a552; } }
  :root[data-theme="dark"] { --bg: #141210; --card: #201c19; --ink: #f6efe4; --muted: #ada39a; --accent: #e7a552; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: ui-rounded, -apple-system, system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 56px; display: flex; flex-direction: column; gap: 26px; }
  h1 { margin: 0; font-size: clamp(32px, 7vw, 52px); font-weight: 900; }
  .bar { width: 72px; height: 7px; border-radius: 4px; background: var(--accent); margin-top: 8px; }
  p { margin: 12px 0 0; color: var(--muted); font-weight: 600; line-height: 1.45; }
  .card { background: var(--card); border-radius: 22px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .card h2 { margin: 4px 6px 12px; font-size: 18px; font-weight: 800; }
  video { width: 100%; display: block; border-radius: 14px; background: #000; }
  .row { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 760px) { .row { grid-template-columns: 1fr 2fr; align-items: start; } }
  .vertical video { max-height: 80vh; width: auto; max-width: 100%; margin: 0 auto; }
  footer { color: var(--muted); font-size: 13px; }
  a { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<main class="wrap">
  <header><h1>Meltaway</h1><div class="bar"></div><p>A visual timer you can see melt. Four calm looks, gentle or hidden numbers, made for time blindness and ADHD.</p></header>
  <section class="row">
    <div class="card vertical"><h2>Vertical clip · 20 s</h2><video controls playsinline preload="metadata" poster="poster-v.jpg" src="meltaway-20s-vertical.mp4"></video></div>
    <div class="card"><h2>Trailer · 30 s</h2><video controls playsinline preload="metadata" poster="poster.jpg" src="meltaway-30s.mp4"></video></div>
  </section>
  <footer>Music: “Calm Piano” by leberch (Pixabay). <a href="../">Privacy and support</a> · <a href="https://raw-coder.github.io/">Raw Coder</a></footer>
</main>
</body>
</html>
